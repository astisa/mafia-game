<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12101a">
<title>Мафия для одного</title>
<style>
:root{
  --bg:#12101a; --panel:#1c1830; --panel2:#241f3d; --line:#39315e;
  --text:#e8e4f5; --dim:#9c94c0; --gold:#d4a44c; --red:#e05252; --green:#57c07a; --blue:#5b8fd9; --purple:#a68ae0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% -20%, #2a2347 0%, var(--bg) 60%);color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:560px;min-height:100vh;display:flex;flex-direction:column;padding:12px}
h1{font-size:1.45em;letter-spacing:.05em;text-align:center;color:var(--gold);margin:4px 0 2px}
.subtitle{text-align:center;color:var(--dim);font-size:.82em;margin-bottom:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
button{font-family:inherit;font-size:1em;border-radius:10px;padding:12px 16px;cursor:pointer;
  background:var(--panel2);color:var(--text);border:1px solid var(--line);width:100%;margin-top:8px;transition:all .15s}
button:active{transform:scale(.98)}
button.primary{background:linear-gradient(135deg,#8a2f2f,#5a1d1d);border-color:#a03c3c;font-weight:600}
button.gold{background:linear-gradient(135deg,#8a6a2f,#5c471d);border-color:#a3853c;font-weight:600}
button.ghost{background:transparent;color:var(--dim)}
button:disabled{opacity:.4;cursor:default}
.hint{color:var(--dim);font-size:.8em;margin:6px 0}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.72em;margin:0 4px 2px 0}
.tag.mafia{background:#4a1d1d;color:#e08a8a}
.tag.civ{background:#1d3a2a;color:#8ae0a8}
.tag.sheriff{background:#1d2f4a;color:#8ab4e0}
.tag.doctor{background:#3a2f1d;color:#e0c68a}
.log{flex:1;overflow-y:auto;padding:6px 2px;max-height:52vh}
.msg{padding:8px 12px;border-radius:12px;margin-bottom:8px;max-width:94%;line-height:1.35;font-size:.92em;animation:fadein .3s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.bot{background:var(--panel2);border-left:3px solid var(--line)}
.msg.sys{background:transparent;color:var(--gold);text-align:center;font-size:.85em;padding:4px}
.msg.night{background:#14102a;color:#b8a8e0;border-left:3px solid #4a3d7a}
.msg.player{background:#22304a;border-left:3px solid var(--blue)}
.msg .who{font-weight:600;font-size:.85em;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin:8px 0}
.pc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;transition:all .15s;position:relative}
.pc:hover{border-color:var(--gold)}
.pc.selected{border-color:var(--gold);background:#332a1a}
.pc.dead{opacity:.45;cursor:default;filter:grayscale(.6)}
.pc.me{border-color:#2f4a8a}
.pc .em{font-size:1.5em}
.pc .nm{font-weight:600;font-size:.82em;margin-top:2px}
.pc .st{font-size:.7em;color:var(--dim);margin-top:2px}
.pc .vote-badge{position:absolute;top:6px;right:8px;background:var(--red);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:700}
.panel{border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.phase-banner{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:6px 0;text-align:center}
.phase-banner .ph{font-weight:700;font-size:1.02em}
.phase-banner .sub{font-size:.78em;color:var(--dim)}
.stat-row{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line);font-size:.9em}
.stat-row:last-child{border-bottom:none}
.big{font-size:2em;text-align:center;margin:8px 0}
.win{color:var(--green)} .lose{color:var(--red)}
.vote-log{font-size:.8em;color:var(--dim);text-align:center;margin:4px 0}
.rolecard{text-align:center;padding:18px}
.rolecard .em{font-size:3em}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.actions button{width:auto;flex:1;min-width:96px;margin-top:0;font-size:.85em;padding:10px 6px}
</style>
</head>
<body>
<noscript><div style="max-width:560px;margin:40px auto;padding:20px;border:2px solid #d4a44c;border-radius:14px;color:#e8e4f5;font-family:sans-serif;text-align:center">⚠️ Игра не отображается, потому что JavaScript не запущен.<br><br>Скачайте этот файл и откройте его в браузере (Chrome или Safari), а не в предпросмотре или файловом менеджере.</div></noscript>
<div id="app"></div>
<script>
"use strict";
window.onerror=function(msg,src,line){
  var el=document.getElementById('app');
  if(el&&!el.innerHTML){ el.innerHTML='<div style="padding:20px;border:2px solid #e05252;border-radius:14px;margin-top:30px;font-family:sans-serif">⚠️ Ошибка игры: '+String(msg)+' (строка '+line+')<br><br>Попробуйте открыть файл в другом браузере: Chrome или Safari.</div>'; }
};
/* ===== Telegram Mini App integration ===== */
try{ var __tg=document.createElement("script"); __tg.src="https://telegram.org/js/telegram-web-app.js"; document.head.appendChild(__tg); }catch(e){}
const TG = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if(TG){ try{ TG.ready(); TG.expand(); }catch(e){} }
function haptic(kind){
  if(TG && TG.HapticFeedback){
    try{
      if(kind==="light") TG.HapticFeedback.impactOccurred("light");
      else if(kind==="medium") TG.HapticFeedback.impactOccurred("medium");
      else if(kind==="success") TG.HapticFeedback.notificationOccurred("success");
      else if(kind==="error") TG.HapticFeedback.notificationOccurred("error");
    }catch(e){}
  }
}
function shareResult(win, roleName, day){
  const txt = win
    ? "Я победил в игре «Мафия для одного»! Роль: "+roleName+". Продержались "+day+" дн. Сыграешь?"
    : "Я проиграл в игре «Мафия для одного»... Роль: "+roleName+". Проверь, сможешь ли ты лучше!";
  const url = "https://t.me/share/url?text="+encodeURIComponent(txt);
  if(TG && TG.openTelegramLink){ TG.openTelegramLink(url); }
  else if(navigator.share){ navigator.share({text:txt}).catch(function(){}); }
  else {
    try{ navigator.clipboard.writeText(txt); alert("Текст скопирован:\n\n"+txt); }
    catch(e){ alert(txt); }
  }
}
const CHARACTERS = [{"id": "veta", "name": "Вета «Баронесса»", "emoji": "👑", "style": "pressing", "desc": "властная, давит на всех"}, {"id": "semyon", "name": "Семён «Тихий»", "emoji": "🕶️", "style": "quiet", "desc": "молчун, говорит метко"}, {"id": "liza", "name": "Лиза «Пуф»", "emoji": "🌸", "style": "emotional", "desc": "эмоциональная, подозревает всех"}, {"id": "garik", "name": "Гарик «Ключ»", "emoji": "🗝️", "style": "chatty", "desc": "болтун, не доверяет никому"}, {"id": "mark", "name": "Марк «Аналитик»", "emoji": "🧮", "style": "analytical", "desc": "логик, опирается на факты"}, {"id": "dasha", "name": "Даша «Тень»", "emoji": "🌙", "style": "cautious", "desc": "осторожная, меняет мнение"}, {"id": "oleg", "name": "Олег «Крот»", "emoji": "🧅", "style": "naive", "desc": "простак, его легко убедить"}];

const ROLE_INFO = {
  civilian:{name:"Мирный житель",tag:"civ",emoji:"🧑‍🌾",night:false,desc:"Ваша сила — интуиция и слово. Днём обвиняйте осторожно: ошибка стоит городу жизни."},
  sheriff:{name:"Шериф",tag:"sheriff",emoji:"⭐",night:true,desc:"Каждую ночь проверяете одного жителя. Постарайтесь дожить до дня — и наведите город на след."},
  doctor:{name:"Доктор",tag:"doctor",emoji:"💉",night:true,desc:"Каждую ночь лечите одного жителя. Если мафия нападёт на леченого — он выживет. Можно лечить и себя."},
  mafia:{name:"Мафия",tag:"mafia",emoji:"🔫",night:true,desc:"Ночью выбираете жертву. Днём притворяйтесь мирным и уводите голоса от своих."},
  don:{name:"Дон",tag:"mafia",emoji:"🎩",night:true,tagText:"Дон",desc:"Главарь мафии. Ночью принимаете финальное решение о жертве."},
};

const PH = {SETUP:"setup",NIGHT:"night",MORNING:"morning",TALK:"talk",ACT:"act",VOTE:"vote",END:"end"};

let S = null;
const SAVE_KEY="mafia_solo_stats_v1";
function loadStats(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY))||freshStats(); }catch(e){ return freshStats(); } }
function freshStats(){ return {games:0,wins:0,streak:0,bestStreak:0,byRole:{}}; }
function saveStats(st){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(st)); }catch(e){} }

const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const alive=()=>S.players.filter(p=>p.alive);
const aliveMafia=()=>S.players.filter(p=>p.alive&&isMafia(p.role));
const aliveCiv=()=>S.players.filter(p=>p.alive&&!isMafia(p.role));
const isMafia=r=>r==="mafia"||r==="don";
const byId=id=>S.players.find(p=>p.character.id===id);
const nameOf=p=>p.character.name;

function newGame(){
  const roles=shuffle(["don","mafia","sheriff","doctor","civilian","civilian","civilian","civilian"]);
  const you={character:{id:"you",name:"Вы",emoji:"🧑",style:"human"},role:roles[0],alive:true,isHuman:true};
  const bots=CHARACTERS.map((c,i)=>({
    character:c, role:roles[i+1], alive:true, isHuman:false,
    suspicion:{}, accusedMafiaCount:0, sheriffKnown:null, sheriffRevealed:false, healedLastSelf:false
  }));
  S={players:[you,...bots], day:0, phase:PH.SETUP, log:[], queue:[], selected:null,
     votes:{}, myActionPoints:2, doctorSelfLastNight:false, sheriffExposed:false, pendingEvict:null};
  bots.forEach(b=>{
    S.players.forEach(p=>{ if(p!==b) b.suspicion[p.character.id]=rnd(3); });
  });
  // мафия-боты не подозревают друг друга (и знают, что они мафия)
  const mbots=bots.filter(b=>isMafia(b.role));
  mbots.forEach(a=>mbots.forEach(b=>{ if(a!==b) a.suspicion[b.character.id]=-50; }));
  sys("Город засыпает. Роли раздались...");
}

function log(who,text,cls,dead){ S.log.push({who,text,cls,dead:!!dead}); }

function sys(text){ log("","⸻ "+text+" ⸻","sys"); }
function addMsg(who,text,cls){ log(who,text,cls||"bot"); }

/* ---------- фазы ---------- */
function startNight(){
  S.day++;
  S.selected=null; S.votes={}; S.myActionPoints=2;
  S.phase=PH.NIGHT;
  sys("Ночь "+S.day+". Город засыпает...");
  const me=S.players[0];
  if(me.alive && ROLE_INFO[me.role].night){
    if(isMafia(me.role)){
      const mates=aliveMafia().filter(p=>!p.isHuman);
      const intro = me.role==="don" ? "Вы Дон. Решение за вами." : "Вы мафия. ";
      addMsg("Мафия 🌙", intro+" Кого убираем этой ночью?","night");
      S.selectMode="kill";
    } else if(me.role==="sheriff"){
      addMsg("Вы — Шериф ⭐","Выберите, кого проверить этой ночью.","night");
      S.selectMode="check";
    } else if(me.role==="doctor"){
      addMsg("Вы — Доктор 💉","Выберите, кого лечить этой ночью.","night");
      S.selectMode="heal";
    }
  } else {
    addMsg("🌙","У вашей роли нет ночных действий. Город спит...","night");
    S.selectMode=null;
  }
  render();
}

function confirmNightTarget(){
  haptic("light");
  const t=byId(S.selected);
  if(!t) return;
  if(S.selectMode==="kill"){
    S.nightKill=t.character.id;
    addMsg("Мафия 🌙","Решено. Орудием станет "+pick(["нож","молчаливый гаррот","удар в темноте"])+"…","night");
    finishNight();
  } else if(S.selectMode==="check"){
    const isM=isMafia(t.role);
    t.checkedResult=isM?"mafia":"civ";
    S.sheriffKnowledge=(S.sheriffKnowledge||[]).concat([{id:t.character.id,res:isM?"mafia":"civ"}]);
    addMsg("Шериф ⭐","Проверка: "+nameOf(t)+" — "+(isM?"МАФИЯ! 🚨":"мирный житель. ✅"),"night");
    finishNight();
  } else if(S.selectMode==="heal"){
    S.nightHeal=t.character.id;
    S.doctorSelfLastNight = t.isHuman;
    addMsg("Доктор 💉","Врач готов. Сегодня лечим: "+nameOf(t)+".","night");
    finishNight();
  }
}

function finishNight(){
  S.selectMode=null; S.selected=null;
  // Ночные действия ботов
  botSheriffCheck();
  botDoctorHeal();
  botMafiaKill();
  resolveMorning();
}

function botSheriffCheck(){
  const sh=S.players.find(p=>!p.isHuman&&p.role==="sheriff"&&p.alive);
  if(!sh) return;
  sh.checkedIds=sh.checkedIds||[];
  const cands=alive().filter(p=>p!==sh);
  if(!cands.length) return;
  const fresh=cands.filter(p=>!sh.checkedIds.includes(p.character.id));
  const pool=fresh.length?fresh:cands;
  const target=pool[rnd(pool.length)];
  sh.checkedIds.push(target.character.id);
  sh.sheriffKnown={id:target.character.id, res:isMafia(target.role)?"mafia":"civ"};
}

function botDoctorHeal(){
  const doc=S.players.find(p=>!p.isHuman&&p.role==="doctor"&&p.alive);
  if(!doc) return;
  const cands=alive().filter(p=>p!==doc);
  if(!cands.length){ S.botHeal=doc.character.id; return; }
  if(Math.random()<0.55){ S.botHeal=doc.character.id; return; }
  // лечим самого "атакуемого" — с максимальным средним подозрением
  const scored=cands.map(p=>{
    let s=0; S.players.forEach(b=>{ if(!b.isHuman&&b.alive&&b!==p) s+=Math.max(0,b.suspicion[p.character.id]||0); });
    return {p,s};
  }).sort((a,b)=>b.s-a);
  S.botHeal=scored[0].p.character.id;
}

function botMafiaKill(){
  if(aliveMafia().some(p=>p.isHuman)) return; // жертву выбрал человек
  const mbs=aliveMafia().filter(p=>!p.isHuman);
  if(!mbs.length) return;
  const cands=alive().filter(p=>!isMafia(p.role));
  if(!cands.length) return;
  const scored=cands.map(p=>{
    let score=1;
    // кто громче топит мафию — опасен
    S.players.forEach(b=>{ if(!b.isHuman&&isMafia(b.role)) score+=Math.max(0,((p.suspicion&&p.suspicion[b.character.id])||0))/4; });
    if(p.isHuman) score+=1; // игрок — приоритетная цель для драмы
    if(p===byId(S.exposedSheriffId)) score+=4;
    if(S.sheriffExposed && p.isHuman && S.players[0].role==="sheriff") score+=4;
    if(S.sheriffExposed && !p.isHuman && p.role==="sheriff") score+=3;
    return {p,score};
  }).sort((a,b)=>b.score-a.score);
  S.botKill=scored[0].p.character.id;
}

function resolveMorning(){
  const killId=S.botKill||S.nightKill;
  const healId=S.botHeal||S.nightHeal;
  S.botKill=S.botHeal=S.nightKill=S.nightHeal=null;
  S.phase=PH.MORNING;
  const queue=[];
  if(killId && killId===healId){
    queue.push({who:"",text:"🌙 → ☀️ Ночью было нападение, но доктор успел спасти жертву! Город просыпается без потерь.",cls:"sys"});
  } else if(killId){
    const v=byId(killId); v.alive=false;
    const roleTxt=v.isHuman?"(это были ВЫ)" : "("+ROLE_INFO[v.role].name+")";
    queue.push({who:"",text:"☀️ Утро "+S.day+". Мёртв: "+nameOf(v)+" "+roleTxt,cls:"sys"});
  } else {
    queue.push({who:"",text:"☀️ Утро "+S.day+". Ночь прошла спокойно — потерь нет.",cls:"sys"});
  }
  S.queue=queue;
  S.afterQueue=()=>{ if(checkEnd()) return; startTalk(); };
  S.phase="queue";
  render();
}

/* ---------- дневное обсуждение ---------- */
function startTalk(){
  S.phase="queue";
  S.queue=[];
  sys("День "+S.day+". Обсуждение");
  // шериф-бот может открыться
  const sh=S.players.find(p=>!p.isHuman&&p.role==="sheriff"&&p.alive&&p.sheriffKnown&&!p.sheriffRevealed);
  if(sh && (sh.sheriffKnown.res==="mafia" ? Math.random()<0.9 : (S.day>=2 && Math.random()<0.35))){
    sh.sheriffRevealed=true;
    S.exposedSheriffId=sh.character.id;
    const t=byId(sh.sheriffKnown.id);
    if(sh.sheriffKnown.res==="mafia"){
      S.players.forEach(b=>{ if(!b.isHuman&&b!==sh&&t&&!isMafia(b.role)) b.suspicion[t.character.id]=(b.suspicion[t.character.id]||0)+8; });
      if(t.isHuman) S.humanExposed=(S.humanExposed||0)+1;
      S.queue.push({who:nameOf(sh),text:"⚠️ Я шериф! В ночь "+S.day+" я проверял(а) "+nameOf(t)+" — это МАФИЯ! Голосуем!",cls:"bot"});
    } else {
      S.players.forEach(b=>{ if(!b.isHuman&&b!==sh&&t) b.suspicion[t.character.id]=Math.max(0,(b.suspicion[t.character.id]||0)-4); });
      S.players.forEach(b=>{ if(!b.isHuman&&b!==sh) b.suspicion[sh.character.id]=Math.max(-50,(b.suspicion[sh.character.id]||0)-3); });
      S.queue.push({who:nameOf(sh),text:"Я шериф, проверял(а) "+nameOf(t)+" — проверка чистая. Но это не значит, что мафии нет среди остальных…",cls:"bot"});
    }
  }
  // реплики живых ботов
  alive().filter(p=>!p.isHuman).forEach(b=>{ const st=botStatement(b); if(st) S.queue.push({who:nameOf(b),text:st,cls:"bot",speaker:b.character.id}); });
  if(S.queue.length===0){ S.afterQueue=()=>startActions(); }
  else S.afterQueue=()=>startActions();
  render();
}

function botStatement(b){
  const me=S.players[0];
  const alive2=alive().filter(p=>p!==b);
  if(!alive2.length) return null;
  // цель обвинения: не свои мафии
  let pool=alive2.filter(p=>!(isMafia(b.role)&&isMafia(p.role)));
  if(!pool.length) return null;
  if(isMafia(b.role) && Math.random()<0.15){
    pool=alive2.filter(p=>p!==b); // ошиблась: обвинила кого попало
  }
  let target=pool.reduce((a,c)=>(b.suspicion[c.character.id]||0)>(b.suspicion[a.character.id]||0)?c:a);
  let tScore=b.suspicion[target.character.id]||0;
  // защита себя, если сильно подозреваем
  if((b.suspicion[b.character.id]||0)>tScore+2 && isMafia(b.role)){
    // мафия защищает себя, обвиняя другого
    target=pool.filter(p=>!isMafia(p.role)).reduce((a,c)=>(b.suspicion[c.character.id]||0)>(b.suspicion[a.character.id]||0)?c:a);
  }
  const T=nameOf(target);
  const isSelfDefense=false;
  const t=target.character.id;
  // подозрение растёт у слушателей
  const weight = isMafia(b.role) ? 0.5 : 1.0;
  S.players.forEach(l=>{
    if(l.isHuman||l===b||!l.alive) return;
    if(isMafia(l.role)&&isMafia(target.role)) return;
    l.suspicion[t]=(l.suspicion[t]||0)+weight;
  });
  // если цель — мафия-бот, он запоминает обидчика
  if(isMafia(target.role)&&!target.isHuman) target.aggro=(target.aggro||0)+1;
  if(isMafia(target.role)&&target.isHuman) S.humanAggro=(S.humanAggro||0)+1;

  const style=b.character.style;
  const L={
    pressing:[T+", объяснись. Я не намерена ждать, пока ты зарежешь нас всех.",
              "Всё ясно. "+T+" — твой выход. Убеди нас, что ты не мафия.",
              T+". Ты слишком спокоен для человека, которого могли убить ночью."],
    quiet:["Смотрю на "+T+". Что-то не так.",""+T+". Я запомнил твоё молчание.","Проверьте "+T+". Ночью он(а) был(а) слишком спокоен(йна)."],
    emotional:[T+"!!! Да ты мафия, я это ЧУВСТВУЮ!!!","Не-не-не, только не "+T+"! Хотя… хотя да, "+T+"!","Голосую сердцем: это "+T+"! Точно!"],
    chatty:["Слушайте, а "+T+" сегодня какой-то нервный, мм?","Я вам скажу так: "+T+" — само подозрение. Нет? Ну а кто тогда?","Так, все смотрят на "+T+". И не зря, между прочим!"],
    analytical:["Факты: "+T+" ведёт себя так, будто знает больше нас. Совпадение? Не думаю.","По моим подсчётам, вероятность мафии у "+T+" максимальна.","Обрати внимание на "+T+": активен днём — опасен ночью. Классика."],
    cautious:["Я не хочу никого обвинять… но "+T+" ведёт себя странно.","Может быть "+T+"? Хотя я не уверен(а). Просто… осторожнее с ним(ней).","Не знаю. Но если прижмёт — скажу "+T+"."],
    naive:["Мне кажется, мафия — это "+T+". Наверное…","А может, это "+T+"? Он(а) вчера так посмотрел(а)…","Я запутался. Но пусть будет "+T+"."]
  };
  return pick(L[style]);
}

function startActions(){
  if(checkEnd()) return;
  S.phase=PH.ACT; S.selected=null;
  render();
}

function humanAction(kind,targetId){
  const me=S.players[0];
  const t=byId(targetId);
  if(!t||!me.alive) return;
  if(kind==="accuse"){
    S.players.forEach(b=>{ if(!b.isHuman&&b.alive&&!isMafia(b.role)) b.suspicion[targetId]=(b.suspicion[targetId]||0)+3; });
    if(isMafia(t.role)&&!t.isHuman) t.aggro=(t.aggro||0)+2;
    if(isMafia(t.role)&&t.isHuman) return;
    addMsg("Вы 🧑",pick(["Я обвиняю "+nameOf(t)+". Слишком много совпадений.",
      nameOf(t)+", у тебя нет алиби. Отвечай.","Смотри, как "+nameOf(t)+" отмалчивается. Это подозрительно."]),"player");
  } else if(kind==="defend"){
    S.players.forEach(b=>{ if(!b.isHuman&&b.alive) b.suspicion[targetId]=Math.max(-50,(b.suspicion[targetId]||0)-3); });
    addMsg("Вы 🧑",pick(["Я верю "+nameOf(t)+". Не топите мирного.",""+nameOf(t)+" — не наш человек, оставьте его(её) в покое.","У "+nameOf(t)+" есть логика. Слушайте её."]),"player");
  } else if(kind==="silence"){
    addMsg("Вы 🧑","…вы храните молчание и наблюдаете.","player");
  }
  S.myActionPoints--;
  S.selected=null;
  if(S.myActionPoints<=0){ startVote(); } else render();
}

/* ---------- голосование ---------- */
function startVote(){
  S.phase=PH.VOTE; S.selected=null; S.votes={};
  sys("Голосование, день "+S.day);
  render();
}

function continueVotes(){ botVotes(); resolveVotes(); }
function humanVote(targetId){
  haptic("medium");
  S.votes["you"]=targetId;
  botVotes();
  resolveVotes();
}

function botVotes(){
  shuffle(alive().filter(p=>!p.isHuman)).forEach(b=>{
    const pool=alive().filter(p=>p!==b && !(isMafia(b.role)&&isMafia(p.role)));
    if(!pool.length){ S.votes[b.character.id]=null; return; }
    const sorted=[...pool].sort((a,c)=>(b.suspicion[c.character.id]||0)-(b.suspicion[a.character.id]||0));
    let target=sorted[0];
    const leader=voteLeaderExcluding(b);
    const leaderSusp = leader ? (b.suspicion[leader.character.id]||0) : -1;
    if(leader && isMafia(leader.role) && !leader.isHuman && !leader.sheriffRevealed){
      if(Math.random()<0.08){
        target=leader; // ошибка/сдача своего — город видит шанс
      } else {
        const alt=sorted.find(p=>!isMafia(p.role));
        if(alt) target=alt;
      }
    } else if(leader && leaderSusp >= (b.suspicion[target.character.id]||0) - 2 && Math.random()<(isMafia(b.role)?0.55:0.7)){
      // идём за городом, если наш собственный кандидат не сильно "чище" лидера
      target=leader;
    }
    S.votes[b.character.id]=target.character.id;
  });
}

function voteLeaderExcluding(voter){
  const tally={};
  Object.values(S.votes).forEach(v=>{ if(v) tally[v]=(tally[v]||0)+1; });
  const ids=Object.keys(tally).sort((a,b)=>tally[b]-tally[a]);
  for(const id of ids){ const p=byId(id); if(p&&p.alive&&p!==voter) return p; }
  return null;
}

function resolveVotes(){
  const tally={};
  Object.entries(S.votes).forEach(([k,v])=>{ if(v) tally[v]=(tally[v]||0)+1; });
  const sortedIds=Object.keys(tally).sort((a,b)=>tally[b]-tally[a]);
  const top=sortedIds[0]?tally[sortedIds[0]]:0;
  const tied=sortedIds.filter(id=>tally[id]===top);
  const voteStr=sortedIds.map(id=>nameOf(byId(id))+" — "+tally[id]).join(", ");
  S.phase="queue"; S.queue=[];
  S.queue.push({who:"",text:"🗳 "+voteStr,cls:"sys"});
  if(tied.length>1||top===0){
    S.queue.push({who:"",text:"Голоса разделились. Город никого не выгнал.",cls:"sys"});
    S.afterQueue=()=>{ if(checkEnd())return; startNight(); };
  } else {
    const victim=byId(sortedIds[0]);
    victim.alive=false;
    const r=ROLE_INFO[victim.role];
    if(!r) throw new Error("no ROLE_INFO for "+victim.role+" id="+victim.character.id);
    const tagText=r.tagText||r.name;
    const wasMafia=isMafia(victim.role);
    S.queue.push({who:"",text:"⚖️ Город выгоняет "+nameOf(victim)+". Роль: "+tagText+" "+r.emoji,cls:"sys"});
    // реплика выгнанного
    const farewell = wasMafia ? pick(["Ха! Попались… но вас всё равно больше.","Вы выгнали только пешку. Дон отомстит.","Это ещё не конец."]).
      split("").map((c,i)=>c).join("") :
      pick(["Я был(а) с вами всё это время… и вы ошиблись.","Ну вот. Мафия смеётся, а я ухожу.","Благодарю за доверие. Ищите настоящую мафию."]);
    S.queue.push({who:nameOf(victim)+" ☠️",text:farewell,cls:"bot",dead:true});
    // корректировка подозрений
    if(wasMafia){
      Object.entries(S.votes).forEach(([vid,tid])=>{
        if(tid===victim.character.id){ const v=byId(vid);
          if(v){ S.players.forEach(b=>{ if(!b.isHuman&&b!==v) b.suspicion[vid]=Math.max(-50,(b.suspicion[vid]||0)-1); }); } }
      });
    } else {
      Object.entries(S.votes).forEach(([vid,tid])=>{
        if(tid===victim.character.id){ const v=byId(vid);
          if(v&&!v.isHuman){ S.players.forEach(b=>{ if(!b.isHuman&&b!==v) b.suspicion[vid]=(b.suspicion[vid]||0)+3; }); } }
      });
    }
    S.afterQueue=()=>{ if(checkEnd())return; startNight(); };
  }
  S.votes={};
  render();
}

/* ---------- конец ---------- */
function checkEnd(){
  const m=aliveMafia().length, c=aliveCiv().length;
  if(m===0){ endGame(true); return true; }
  if(m>=c){ endGame(false); return true; }
  return false;
}

function endGame(cityWon){
  S.phase=PH.END;
  const me=S.players[0];
  const iWon = cityWon ? !isMafia(me.role) : isMafia(me.role);
  if(me.alive || true){ /* статистика пишется всегда */ }
  const st=loadStats();
  st.games++;
  if(iWon) st.wins++; 
  st.streak = iWon ? st.streak+1 : 0;
  st.bestStreak=Math.max(st.bestStreak||0,st.streak);
  const rk=me.role;
  st.byRole[rk]=(st.byRole[rk]||0)+1;
  saveStats(st);
  S.result={cityWon,iWon};
  haptic(iWon?"success":"error");
  render();
}

/* ---------- рендер ---------- */
function render(){
  const app=document.getElementById("app");
  const me=S.players[0];
  const aliveCnt=alive().length;
  let h="<h1>🌃 Мафия для одного</h1>";
  h+="<div class='subtitle'>день "+S.day+" · живых: "+aliveCnt+"</div>";

  if(S.phase===PH.SETUP){
    const r=ROLE_INFO[me.role];
    h+="<div class='card rolecard'><div class='em'>"+r.emoji+"</div><h2 style='margin:6px 0'>"+r.name+"</h2>";
    h+="<span class='tag "+r.tag+"'>"+(r.tagText||r.name)+"</span><p class='hint' style='margin-top:8px'>"+r.desc+"</p></div>";
    h+="<div class='card'><div style='font-weight:600;margin-bottom:4px'>Состав города:</div><div>2 мафии (включая Дона) · 1 шериф · 1 доктор · 3 мирных · и вы.</div></div>";
    h+="<button class='gold' onclick='startNight()'>Начать ночь 🌙</button>";
    h+="<button class='ghost' onclick='renderStats()' style='margin-top:8px'>Моя статистика 📊</button>";
    app.innerHTML=h; return;
  }

  if(S.phase===PH.END){
    const res=S.result;
    h+="<div class='card'><div class='big "+(res.iWon?"win":"lose")+"'>"+(res.iWon?"ПОБЕДА! 🎉":"ПОРАЖЕНИЕ ☠️")+"</div>";
    h+="<div style='text-align:center'>"+(res.cityWon?"Город очистился от мафии.":"Мафия захватила город.")+"</div>";
    h+="<div class='stat-row'><span>Ваша роль</span><span>"+ROLE_INFO[me.role].name+"</span></div>";
    h+="<div class='stat-row'><span>Продержались дней</span><span>"+S.day+"</span></div>";
    h+="<div class='stat-row'><span>Победа?</span><span>"+(res.iWon?"да":"нет")+"</span></div></div>";
    h+="<button class='gold' onclick='shareResult(S.result.iWon, ROLE_INFO[me.role].name, S.day)'>Поделиться результатом 📣</button>";
    h+="<button class='primary' onclick='newGame();render()'>Играть ещё 🎲</button>";
    h+="<button class='ghost' onclick='renderStats()'>Статистика 📊</button>";
    app.innerHTML=h; return;
  }

  // лента
  h+="<div class='log' id='log'>";
  S.log.forEach(m=>{
    const cls="msg "+(m.cls||"bot")+(m.dead?" dead":"");
    const who=m.who?("<div class='who'>"+esc(m.who)+"</div>"):"";
    h+="<div class='"+cls+"'>"+who+esc(m.text)+"</div>";
  });
  h+="</div>";

  // очередь реплик
  if(S.phase==="queue"){
    h+="<div class='phase-banner'><div class='ph'>…</div><div class='sub'>город говорит</div></div>";
    h+="<button class='gold' onclick='nextQueue()'>Дальше ▶</button>";
    app.innerHTML=h; scrollLog(); return;
  }

  // карточки игроков
  h+="<div class='grid'>";
  S.players.forEach(p=>{
    const dead=!p.alive;
    const r=ROLE_INFO[p.role];
    let tags="";
    if(dead){ tags+="<span class='tag dead'>☠️ мёртв</span>"; }
    if(dead || (S.phase===PH.NIGHT&&(isMafia(me.role)||me.role==="don")&&isMafia(p.role)&&p.isHuman===false) || (p.isHuman&&S.phase!==PH.SETUP&&false)){
      // роль видна: у мёртвых всем; мафии видят своих мафий ночью
      tags+="<span class='tag "+r.tag+"'>"+(r.tagText||r.name)+" "+r.emoji+"</span>";
    }
    const vb=S.votes[p.character.id]?("<div class='vote-badge'>"+Object.values(S.votes).filter(v=>v===p.character.id).length+"</div>"):"";
    const sel=S.selected===p.character.id?" selected":"";
    const clickable = (S.selectMode && p.alive && (S.selectMode==="heal" || !p.isHuman)) || (S.phase===PH.ACT && p.alive && !p.isHuman);
    const clickableVote = S.phase===PH.VOTE && p.alive && !p.isHuman;
    h+="<div class='pc"+(dead?" dead":"")+(sel?" selected":"")+(p.isHuman?" me":"")+"' "+
       (clickable||clickableVote?("onclick=\"selectCard('"+p.character.id+"')\""):"")+">"+
       "<div class='em'>"+p.character.emoji+"</div><div class='nm'>"+esc(p.character.name)+"</div>"+
       "<div class='st'>"+(p.isHuman?"это вы":esc(p.character.desc))+"</div>"+tags+vb+"</div>";
  });
  h+="</div>";

  // панель действий
  h+="<div class='panel'>";
  if(S.phase===PH.NIGHT){
    if(S.selectMode){
      h+="<div class='hint'>";
      h+= S.selectMode==="kill"?"Выберите жертву (нажмите на карточку):":
          S.selectMode==="check"?"Кого проверить? Нажмите на карточку:":
          "Кого лечим? Нажмите на карточку:";
      h+="</div>";
      h+="<button class='primary' "+(S.selected?"":"disabled")+" onclick='confirmNightTarget()'>Подтвердить</button>";
    } else {
      h+="<button class='gold' onclick='finishNightPublic()'>Проснуться ☀️</button>";
    }
  } else if(S.phase===PH.MORNING){
    h+="<button class='gold' onclick='startTalk()'>Начать обсуждение 💬</button>";
  } else if(S.phase===PH.ACT){
    if(!me.alive){ h+="<div class='hint'>Вы мертвы. Наблюдайте за городом.</div><button class='gold' onclick='startVote()'>Дальше 🗳</button></div>"; app.innerHTML=h; scrollLog(); return; }
    h+="<div class='hint'>Ваши слова (осталось реплик: "+S.myActionPoints+"):</div>";
    h+="<div class='actions'>";
    h+="<button class='primary' "+(S.selected?"":"disabled")+" onclick='humanAction(\"accuse\",S.selected)'>Обвинить</button>";
    h+="<button "+(S.selected?"":"disabled")+" onclick='humanAction(\"defend\",S.selected)'>Защитить</button>";
    h+="<button onclick='humanAction(\"silence\",null)'>Молчать</button>";
    h+="</div>";
    h+="<button class='gold' onclick='startVote()'>Перейти к голосованию 🗳</button>";
  } else if(S.phase===PH.VOTE){
    if(!me.alive){ h+="<div class='hint'>Вы мертвы. Город голосует без вас.</div><button class='gold' onclick='continueVotes()'>Дальше 🗳</button></div>"; app.innerHTML=h; scrollLog(); return; }
    h+="<div class='hint'>Кого выгоняем из города? Нажмите на карточку.</div>";
    h+="<button class='primary' "+(S.selected?"":"disabled")+" onclick='humanVote(S.selected)'>Проголосовать</button>";
  }
  h+="</div>";
  app.innerHTML=h; scrollLog();
}

function finishNightPublic(){ finishNight(); }
function nextQueue(){
  if(S.queue.length){
    const m=S.queue.shift();
    log(m.who,m.text,m.cls,m.dead);
    render(); return;
  }
  const f=S.afterQueue; S.afterQueue=null;
  if(f) f(); else render();
}
function selectCard(id){
  if(S.phase===PH.VOTE||S.phase===PH.ACT){ S.selected=id; render(); return; }
  if(S.selectMode){
    if(S.selectMode==="kill"){ const t=byId(id); if(isMafia(t.role)) return; }
    if(S.selectMode==="heal"){
      const t=byId(id);
      if(t.isHuman && S.doctorSelfLastNight){ return; }
    }
    S.selected=id;
  }
  render();
}
function renderStats(){
  const st=loadStats();
  const app=document.getElementById("app");
  let h="<h1>📊 Статистика</h1><div class='card'>";
  h+="<div class='stat-row'><span>Партий сыграно</span><span>"+st.games+"</span></div>";
  h+="<div class='stat-row'><span>Побед</span><span>"+st.wins+"</span></div>";
  h+="<div class='stat-row'><span>Серия побед</span><span>"+st.streak+"</span></div>";
  h+="<div class='stat-row'><span>Лучшая серия</span><span>"+st.bestStreak+"</span></div>";
  h+="</div><button class='gold' onclick='"+(S&&S.phase!==undefined?"render()":"newGame();render()")+"'>Назад</button>";
  app.innerHTML=h;
}
function scrollLog(){ const l=document.getElementById("log"); if(l) l.scrollTop=l.scrollHeight; }

newGame();
render();
</script>
